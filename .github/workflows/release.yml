name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate
        run: python scripts/validate.py
      - name: Check the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "\"version\": \"${version}\"" .claude-plugin/plugin.json || { echo "::error::plugin.json does not declare version ${version}."; exit 1; }
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v h="## [${version}]" 'index($0, h) == 1 {on=1; next} substr($0,1,3) == "## " || substr($0,1,1) == "[" {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md has no section for ${version}."; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
